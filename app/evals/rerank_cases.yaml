# rerank 增量评测语料 + 用例（docs/项目实现文档-阶段4.md §9.5）
#
# 用途：对比 RERANK_ENABLED=false / true 两趟检索的 Top-1 / Top-5 命中率，
#       用数据决定是否长期保留这个约 1GB 的 cross-encoder，而非"教程说必须加"。
#
# 运行： .venv/bin/python scripts/eval_rerank.py
#
# 设计要点（决定评测是否"测得出东西"）：
#   - corpus 覆盖多个主题，且刻意制造**关键词撞车的近邻**（refund_* 三片、
#     return_* 两片、shipping_* 两片、privacy / account_security / data_export 三片）。
#     撞车处正是 rerank 唯一可能产生增量的地方——纯关键词/RRF 常把同主题不同
#     意图的切片排到前面，cross-encoder 读完整 (query, doc) 对后有机会纠正。
#   - cases 里既有"简单题"（向量一眼命中，rerank 无从发挥），也有"意图歧义题"
#     （问法与目标片用词不同、却与干扰片用词相同），后者才考验精排。
#   - expect 用 corpus 的 key 指定"标准答案切片"，脚本灌库后按 chunk_id 判定命中。

corpus:
  - key: refund_time
    title: 退款到账时间
    content: 退款到账时间：审核通过后，退款将在 5 到 7 个工作日内原路返回至您的支付账户。
  - key: refund_apply
    title: 如何申请退款
    content: 如何申请退款：请在订单详情页点击“申请退款”，填写退款原因并上传凭证，客服将受理。
  - key: refund_reject
    title: 退款被驳回
    content: 退款被驳回怎么办：若退款申请被驳回，可在 7 天内补充材料重新提交，或联系在线客服申诉。
  - key: return_policy
    title: 退货政策
    content: 退货政策：商品签收后 7 天内可申请无理由退货，定制品与贴身衣物除外，退货运费由买家承担。
  - key: return_exchange
    title: 换货流程
    content: 换货流程：如需更换型号或颜色，可在退货页面选择“换货”，同款商品免运费换新一次。
  - key: warranty
    title: 保修说明
    content: 保修说明：大家电整机保修一年、主要部件保修三年，保修期内非人为损坏免费维修。
  - key: repair
    title: 维修服务
    content: 维修服务：保修期外可付费维修，官方维修点遍布全国，维修前请提前预约并备份数据。
  - key: shipping
    title: 配送时效
    content: 配送时效：现货商品 24 小时内发货，一般 2 到 3 天送达，偏远地区顺延至 5 到 7 天。
  - key: shipping_fee
    title: 运费规则
    content: 运费规则：单笔订单实付满 99 元免运费，未满则收取基础运费 8 元，超重另计续重费。
  - key: invoice
    title: 发票开具
    content: 发票开具：下单时可填写开票信息，电子发票将在收货后 3 个工作日内发送至预留邮箱。
  - key: membership
    title: 会员权益
    content: 会员权益：黄金会员享全场 95 折、生日双倍积分与专属客服通道，年费 88 元。
  - key: points
    title: 积分规则
    content: 积分规则：每消费 1 元累积 1 积分，积分可在结算时抵扣现金，100 积分抵 1 元。
  - key: payment
    title: 支付方式
    content: 支付方式：支持微信、支付宝、银联及花呗分期，部分商品支持货到付款。
  - key: privacy
    title: 隐私政策
    content: 隐私政策：我们仅提供服务所必需的信息，绝不会将您的个人信息出售给第三方。
  - key: account_security
    title: 账号安全
    content: 账号安全：若发现异地登录，请立即修改密码并开启两步验证，必要时联系客服冻结账号。
  - key: customer_service_hours
    title: 客服工作时间
    content: 客服工作时间：人工客服每日 9:00 至 22:00 在线，非工作时间可留言，次日优先处理。
  - key: promo
    title: 优惠活动
    content: 优惠活动：双十一全场跨店满 300 减 50，可与会员折扣叠加，特价商品不参与。
  - key: data_export
    title: 数据导出
    content: 数据导出：您可在账户设置的隐私页面申请导出个人数据，处理后 15 天内发送至邮箱。

cases:
  - question: 我申请了退款，钱大概几天能到账？
    expect: refund_time
  - question: 东西不想要了，可以退吗？
    expect: return_policy
  - question: 收到的商品颜色不对，想换一个
    expect: return_exchange
  - question: 空调还在保修期内坏了，维修要收费吗？
    expect: warranty
  - question: 过保的笔记本屏幕坏了能修吗
    expect: repair
  - question: 下单之后多久给我发货？
    expect: shipping
  - question: 买东西还要另外付邮费吗
    expect: shipping_fee
  - question: 我需要报销，可以开发票吗
    expect: invoice
  - question: 办那个付费会员有什么用，划算吗
    expect: membership
  - question: 消费攒下来的分数能不能抵钱用
    expect: points
  - question: 我可以用花呗来付款吗
    expect: payment
  - question: 你们会不会把我的信息卖给别的公司
    expect: privacy
  - question: 总感觉账号被人异地登录，怎么保护
    expect: account_security
  - question: 周末晚上想找人工客服咨询问题
    expect: customer_service_hours
  - question: 双十一有哪些打折优惠活动
    expect: promo
  - question: 我想把自己账号里的资料下载下来备份
    expect: data_export
