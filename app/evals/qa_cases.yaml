# 评测集：语料 + 人工手标用例（阶段 6，docs/项目实现文档-阶段6.md §4.4 / §4.5）
#
# ★ 单文件自洽、可复现：eval_qa.py 把 `documents` 灌入独立评测用户（带真实向量），
#   跑完级联删除；`cases` 的 expected_doc_titles 映射为 document_id 算检索指标，
#   key_points 交给 LLM judge 算生成指标。**改语料 = 基线作废，需重跑并更新基线表。**
#
# 字段说明：
#   expected_doc_titles  你**希望**被召回的文档（不是"所有相关文档"，否则指标失真，§4.4）
#   key_points           生成完整性判定的"必须覆盖要点"（需 judge）
#   retrieval_query      仅多轮用例需要：把带指代的问法解析成自包含检索句，
#                        使检索指标可脱离"实时查询改写"独立复现（改写本身由阶段 4 已测）
#   expect_refusal       不可回答类：期望模型拒答而非编造（幻觉防线，§4.4 必标）
#
# 运行： .venv/bin/python scripts/eval_qa.py            （全量，含 judge）
#        .venv/bin/python scripts/eval_qa.py --no-judge  （只检索指标，零 LLM 成本）

version: 1

documents:
  - title: 售后政策
    chunks:
      - 退款流程：用户需在订单页提交退款申请，客服在 3 个工作日内完成审核。审核通过后，款项将在 5-7 个工作日退回原支付渠道。
      - 退货政策：商品签收后 7 天内可申请无理由退货，定制品与生鲜类商品不支持七天无理由退货；贴身衣物一经拆封不予退换。
      - 质量问题换货：商品存在质量问题时，签收 15 天内可免费换新一次，换货运费由平台承担。
  - title: 发票说明
    chunks:
      - 发票开具：需在下单后 7 天内申请，支持电子普通发票与增值税专用发票。电子发票在收货后 3 个工作日内发送至预留邮箱。
      - 发票遗失可在账户后台申请重新开具，一年以内最多重开 3 次。
  - title: 物流与配送
    chunks:
      - 配送时效：现货商品 24 小时内发货，一般 2-3 天送达，偏远地区顺延至 5-7 天。
      - 运费规则：单笔订单实付满 99 元免运费，未满则收取基础运费 8 元，超重部分按 2 元每公斤计续重费。
  - title: 会员与积分
    chunks:
      - 黄金会员年费 88 元，享全场 95 折、生日当月双倍积分与专属客服通道。
      - 积分规则：每消费 1 元累积 1 积分，积分可在结算时抵扣现金，100 积分抵 1 元，单笔最多抵扣货款的 30%。
  - title: 账号与安全
    chunks:
      - 账号安全：发现异地登录请立即修改密码并开启两步验证，必要时联系客服临时冻结账号。
      - 忘记密码可通过注册手机号接收验证码重置；号码不可用时提交身份证明，人工审核 3 个工作日内完成。
      - 数据导出：在账户设置的隐私页面申请，提交后 15 个工作日内将数据包发送至注册邮箱。

cases:
  # ---------- 直问（基线，应全对）8 条 ----------
  - id: refund_eta
    question: 退款需要多久到账？
    expected_doc_titles: ["售后政策"]
    key_points: ["客服 3 个工作日内审核", "审核通过后 5-7 个工作日退回原支付渠道"]
    tags: [退款, 时效, 直问]
    difficulty: easy

  - id: invoice_deadline
    question: 申请发票有时限吗？
    expected_doc_titles: ["发票说明"]
    key_points: ["下单后 7 天内申请"]
    tags: [发票, 直问]
    difficulty: easy

  - id: shipping_time
    question: 下单之后多久能到货？
    expected_doc_titles: ["物流与配送"]
    key_points: ["现货 24 小时内发货", "一般 2-3 天送达"]
    tags: [物流, 直问]
    difficulty: easy

  - id: membership_benefit
    question: 黄金会员多少钱，有什么权益？
    expected_doc_titles: ["会员与积分"]
    key_points: ["年费 88 元", "全场 95 折"]
    tags: [会员, 直问]
    difficulty: easy

  - id: points_redeem
    question: 积分怎么抵扣现金？
    expected_doc_titles: ["会员与积分"]
    key_points: ["100 积分抵 1 元", "单笔最多抵扣货款的 30%"]
    tags: [积分, 直问]
    difficulty: easy

  - id: password_reset
    question: 忘记密码了怎么找回？
    expected_doc_titles: ["账号与安全"]
    key_points: ["注册手机号收验证码重置", "号码不可用时人工审核 3 个工作日"]
    tags: [账号, 直问]
    difficulty: easy

  - id: invoice_lost
    question: 发票丢了能重新开吗？
    expected_doc_titles: ["发票说明"]
    key_points: ["可在账户后台申请重开", "一年以内最多重开 3 次"]
    tags: [发票, 直问]
    difficulty: easy

  - id: quality_exchange
    question: 商品有质量问题可以换货吗？
    expected_doc_titles: ["售后政策"]
    key_points: ["签收 15 天内可免费换新一次", "换货运费由平台承担"]
    tags: [换货, 直问]
    difficulty: easy

  # ---------- 同义改写（无关键词重叠，考向量）5 条 ----------
  - id: refund_eta_colloquial
    question: 钱什么时候能退给我？
    expected_doc_titles: ["售后政策"]
    key_points: ["5-7 个工作日退回原支付渠道"]
    tags: [退款, 同义改写]
    difficulty: medium

  - id: shipping_colloquial
    question: 东西大概几天能到我手上？
    expected_doc_titles: ["物流与配送"]
    key_points: ["一般 2-3 天送达"]
    tags: [物流, 同义改写]
    difficulty: medium

  - id: membership_colloquial
    question: 办那个付费的划算吗？
    expected_doc_titles: ["会员与积分"]
    key_points: ["全场 95 折"]
    tags: [会员, 同义改写]
    difficulty: medium

  - id: data_export_colloquial
    question: 我想把自己账号里的东西备份一份带走。
    expected_doc_titles: ["账号与安全"]
    key_points: ["隐私页面申请", "15 个工作日内发送"]
