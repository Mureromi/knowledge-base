  - id: cross_freight_fee
    question: 包邮门槛是多少？退货运费谁出？
    expected_doc_titles: ["物流与配送", "售后政策"]
    key_points: ["实付满 99 元免运费", "质量问题换货运费由平台承担"]
    tags: [跨文档, 运费]
    difficulty: hard

  # ---------- 不可回答（拒答，幻觉防线）4 条 ----------
