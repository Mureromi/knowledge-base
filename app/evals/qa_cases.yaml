  # ---------- 跨文档（考多文档召回）3 条 ----------
  - id: cross_refund_invoice
    question: 退款和发票这两件事分别有什么时间要求？
    expected_doc_titles: ["售后政策", "发票说明"]
    key_points: ["退款到账 5-7 个工作日", "发票需下单后 7 天内申请"]
